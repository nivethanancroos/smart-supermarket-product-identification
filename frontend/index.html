<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Supermarket Product Identification</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --border: #d8dee5;
        --text: #1f2933;
        --muted: #64748b;
        --accent: #2f6fed;
        --accent-soft: #eaf1ff;
        --ok: #1f9d55;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 32px 16px 64px;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      p.subtitle {
        color: var(--muted);
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 14px;
      }

      .dropzone {
        border: 2px dashed var(--border);
        border-radius: 12px;
        background: var(--card);
        padding: 48px 24px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .dropzone.dragover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .dropzone .icon {
        font-size: 40px;
        margin-bottom: 8px;
      }
      .dropzone .hint {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .dropzone input {
        display: none;
      }

      .detector-toggle {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        font-size: 13px;
        color: var(--text);
      }
      .detector-toggle .toggle-label {
        color: var(--muted);
        font-weight: 600;
      }
      .detector-toggle label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }

      .status {
        margin: 16px 0;
        font-size: 14px;
        color: var(--muted);
        display: none;
      }
      .status.visible {
        display: block;
      }

      .error {
        display: none;
        margin: 16px 0;
        padding: 12px 16px;
        background: #fdecea;

        border-radius: 8px;
        font-size: 14px;
      }
      .error.visible {
        display: block;
      }

      .results {
        display: none;
        margin-top: 24px;
        gap: 20px;
        grid-template-columns: 1fr 1fr minmax(260px, 320px);
      }
      .results.visible {
        display: grid;
      }
      @media (max-width: 960px) {
        .results.visible {
          grid-template-columns: 1fr 1fr;
        }
        .results.visible .card.summary {
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 640px) {
        .results.visible {
          grid-template-columns: 1fr;
        }
        .results.visible .card.summary {
          grid-column: auto;
        }
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      .card h2 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .card img {
        width: 100%;
        border-radius: 8px;
        display: block;
      }

      .total-line {
        font-size: 15px;
        margin-bottom: 12px;
        padding: 10px 12px;
        background: var(--accent-soft);
        border-radius: 8px;
        color: var(--accent);
        font-weight: 600;
      }

      .bar-row {
        margin-bottom: 14px;
      }
      .bar-row:last-child {
        margin-bottom: 0;
      }
      .bar-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 5px;
      }
      .bar-label {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
      }
      .bar-value {
        font-size: 13px;
        color: var(--muted);
        flex-shrink: 0;
        white-space: nowrap;
      }
      .bar-track {
        background: #eef1f5;
        border-radius: 5px;
        height: 12px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 5px;
      }
      .unknown-row .bar-label {
        color: #b45309;
      }
      .unknown-row .bar-fill {
        background: #f59e0b;
      }

      .reset-btn {
        display: none;
        margin-top: 20px;
        background: none;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }
      .reset-btn.visible {
        display: inline-block;
      }
      .reset-btn:hover {
        background: #f1f4f8;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Smart Supermarket Product Identification</h1>
      <p class="subtitle">
        Drop a basket/product image to detect items, classify them, and see
        per-category counts.
      </p>

      <div class="detector-toggle" id="detectorToggle">
        <span class="toggle-label">Detector:</span>
        <label
          ><input type="radio" name="detector" value="yolo" checked /> YOLO —
          D2S supermarket detector (60 classes)</label
        >
        <label
          ><input type="radio" name="detector" value="classical" /> Classical
          (OpenCV + CNN, 25 classes)</label
        >
      </div>

      <div class="dropzone" id="dropzone">
        <div class="icon">📦</div>
        <div>Drag &amp; drop an image here, or click to browse</div>
        <div class="hint">PNG or JPG</div>
        <input type="file" id="fileInput" accept="image/*" />
      </div>

      <div class="status" id="status">Analyzing…</div>
      <div class="error" id="error"></div>

      <div class="results" id="results">
        <div class="card">
          <h2>Uploaded Image</h2>
          <img id="originalImage" alt="Uploaded image" />
        </div>
        <div class="card">
          <h2>Detected &amp; Counted</h2>
          <img id="annotatedImage" alt="Annotated result" />
        </div>
        <div class="card summary">
          <h2>Summary</h2>
          <div class="total-line" id="totalLine"></div>
          <div id="barChart"></div>
        </div>
      </div>

      <button class="reset-btn" id="resetBtn">Analyze another image</button>
    </div>

    <script>
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");
      const status = document.getElementById("status");
      const errorBox = document.getElementById("error");
      const results = document.getElementById("results");
      const resetBtn = document.getElementById("resetBtn");
      let originalImageUrl = null;

      dropzone.addEventListener("click", () => fileInput.click());

      dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
      });
      dropzone.addEventListener("dragleave", () =>
        dropzone.classList.remove("dragover"),
      );
      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) handleFile(fileInput.files[0]);
      });
      resetBtn.addEventListener("click", () => {
        results.classList.remove("visible");
        errorBox.classList.remove("visible");
        resetBtn.classList.remove("visible");
        fileInput.value = "";
        if (originalImageUrl) {
          URL.revokeObjectURL(originalImageUrl);
          originalImageUrl = null;
        }
      });

      async function handleFile(file) {
        errorBox.classList.remove("visible");
        results.classList.remove("visible");
        resetBtn.classList.remove("visible");
        status.classList.add("visible");
        status.textContent = "Analyzing…";

        if (originalImageUrl) URL.revokeObjectURL(originalImageUrl);
        originalImageUrl = URL.createObjectURL(file);
        document.getElementById("originalImage").src = originalImageUrl;

        const detectorValue = document.querySelector(
          'input[name="detector"]:checked',
        ).value;
        const formData = new FormData();
        formData.append("file", file);
        formData.append("detector", detectorValue);

        try {
          const res = await fetch("/api/analyze", {
            method: "POST",
            body: formData,
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.detail || `Request failed (${res.status})`);
          }
          const data = await res.json();
          renderResults(data);
        } catch (err) {
          errorBox.textContent =
            err.message || "Something went wrong while analyzing the image.";
          errorBox.classList.add("visible");
        } finally {
          status.classList.remove("visible");
        }
      }

      function renderResults(data) {
        document.getElementById("annotatedImage").src = data.annotated_image;
        const detectorName = data.detector === "yolo" ? "YOLO" : "Classical";
        document.getElementById("totalLine").textContent =
          `Total products detected: ${data.total_products} (${detectorName})`;

        const entries = Object.entries(data.category_counts).sort(
          (a, b) => b[1] - a[1],
        );

        function formatLabel(label) {
          if (label === "UNKNOWN") return label;
          return label
            .replace(/_/g, " ")
            .replace(/\b\w/g, (c) => c.toUpperCase());
        }

        const barChart = document.getElementById("barChart");
        barChart.innerHTML = "";
        const maxCount = entries.length ? entries[0][1] : 1;
        for (const [label, count] of entries) {
          const pct = data.category_percentages[label];
          const row = document.createElement("div");
          row.className =
            "bar-row" + (label === "UNKNOWN" ? " unknown-row" : "");
          const widthPct = (count / maxCount) * 100;
          row.innerHTML = `
      <div class="bar-top">
        <span class="bar-label">${formatLabel(label)}</span>
        <span class="bar-value">${count} &middot; ${pct.toFixed(1)}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${widthPct}%"></div></div>
    `;
          barChart.appendChild(row);
        }

        results.classList.add("visible");
        resetBtn.classList.add("visible");
      }
    </script>
  </body>
</html>
